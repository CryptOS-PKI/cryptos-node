name: Label Sync
# Reconciles the repo's labels to the canonical set (.github/labels.yml):
# creates/updates the canonical labels AND deletes any label not in the file,
# so every repo carries exactly the standard set (no stale GitHub defaults or
# leftover release labels).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
permissions:
  issues: write
jobs:
  labeler:
    name: Sync labels
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d  # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: false
          dry-run: false
