name: GoLic
# Verify every source file carries the Apache 2.0 license header. golic (Bugs5382's own
# tool) is run through go-task (`task license`) -- the standard runner for every
# project. `golic inject --dry -x` fails the check if a header is missing; it never
# modifies files. Docs (**.md) are skipped -- they carry no header.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore: ['**.md']
# One run per PR per workflow: a new push cancels the older PR run. Pushes to
# main are never cancelled, so every main commit keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  golic:
    name: 🔏 License headers
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: 'stable'
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          # Pin an exact, existing go-task version. setup-task's `3.x` range
          # resolution mis-computes a nonexistent version (observed: v3.52.0 ->
          # 404 on download; latest real is v3.51.1), breaking the check on every
          # PR. Pinning skips the broken lookup entirely; bump deliberately.
          version: 3.51.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify license headers
        run: |
          export PATH="${PATH}:$(go env GOPATH)/bin"
          task license
